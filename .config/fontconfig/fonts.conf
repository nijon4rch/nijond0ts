<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Rixlovefool Cyrillic Patch</family>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>
  
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Rixlovefool Cyrillic Patch</family>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Rixlovefool Cyrillic Patch</family>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <!-- <family>MonaspiceRn Nerd Font Mono</family> -->
      <family>Rixlovefool Cyrillic Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>

</fontconfig>
